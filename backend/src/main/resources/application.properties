spring.application.name=career-compass-backend
server.port=${PORT:${SERVER_PORT:8081}}

# MySQL database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/career_compass?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Error messages
server.error.include-message=always

# Frontend connection
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}